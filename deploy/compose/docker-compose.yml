name: owlwire

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: owlwire
      POSTGRES_PASSWORD: ${OWLWIRE_DB_OWNER_PASSWORD:?set OWLWIRE_DB_OWNER_PASSWORD in .env}
      POSTGRES_DB: owlwire
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owlwire -d owlwire"]
      interval: 5s
      timeout: 3s
      retries: 20

  owlwire:
    image: ghcr.io/owlwire/owlwire:dev
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    command: ["serve", "--role", "all"]
    # main.ts gives up on a graceful stop after 25 s; leave headroom before SIGKILL
    stop_grace_period: 40s
    # Hardening: the image already runs as 1000:1000 (non-root). The server writes nothing to disk, so the root
    # filesystem is read-only and needs no tmpfs; it needs no Linux capabilities and may not gain privileges.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    env_file: .env
    environment:
      # Two roles: migrations run as the owner, the server connects as owlwire_app (subject to RLS).
      OWLWIRE_MIGRATION_DATABASE_URL: postgres://owlwire:${OWLWIRE_DB_OWNER_PASSWORD:?set OWLWIRE_DB_OWNER_PASSWORD in .env}@postgres:5432/owlwire
      OWLWIRE_DATABASE_URL: postgres://owlwire_app:${OWLWIRE_DB_APP_PASSWORD:?set OWLWIRE_DB_APP_PASSWORD in .env}@postgres:5432/owlwire
    ports:
      # loopback only; put a reverse proxy with TLS in front for remote access
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
