packages:
  - apps/*
  - packages/*
  - packages/adapters/*

allowBuilds:
  "@swc/core": true
  cpu-features: false
  esbuild: true
  protobufjs: true
  ssh2: false

# esbuild advisories GHSA-67mh-4wv8-2f99 (<=0.24.2) and GHSA-g7r4-m6w7-qqqr
# (>=0.27.3 <0.28.1): move the transitive consumers to a patched release.
overrides:
  "@esbuild-kit/core-utils>esbuild": ^0.28.2
  "tsup>esbuild": ^0.28.2
  # cosmiconfig (via graphile-worker) has an optional typescript peer, which pnpm fills from the workspace root.
  # That put the native tsc binary into the production image, and Trivy flags the Go runtime it is built with.
  # Owlwire passes graphile-worker its options in code and never loads a TypeScript config file, so drop the peer.
  "cosmiconfig>typescript": "-"
