<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Owlwire dev panel</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; color: #1b1f24; }
      form { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 1rem; }
      input { min-width: 22rem; padding: 0.3rem; }
      table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
      th, td { border-bottom: 1px solid #d0d7de; padding: 0.4rem; text-align: left; vertical-align: top; }
      .error { color: #b42318; }
      .muted { color: #57606a; }
      .status { padding: 0.1rem 0.4rem; border-radius: 0.3rem; background: #eaeef2; }
      .status-delivered { background: #dafbe1; }
      .status-failed { background: #ffebe9; }
      .status-scheduled, .status-sending { background: #fff8c5; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
