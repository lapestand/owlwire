name: Pull request

# Checks on the pull request itself rather than its code. This workflow runs on its own (not through ci.yml) so
# that editing the title or description re-runs only these two jobs. Both are required status checks next to
# CI passed; they run on every pull request event, so they are never missing.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  title:
    name: PR title
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # A squash merge uses the PR title as the commit message, so it must pass the commit policy.
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          title_file="$RUNNER_TEMP/pr-title.txt"
          printf '%s\n' "$PR_TITLE" > "$title_file"
          node scripts/check-commit-msg.mjs "$title_file"

  issue-link:
    name: PR issue link
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # The description must link an issue (Fixes/Closes/Resolves #n or Refs #n) or carry a "No issue: <reason>"
      # line; Dependabot is exempt. Rules in scripts/check-pr-issue-link.mjs.
      - name: Check that the description links an issue
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          body_file="$RUNNER_TEMP/pr-body.md"
          printf '%s\n' "$PR_BODY" > "$body_file"
          node scripts/check-pr-issue-link.mjs "$body_file" "$PR_AUTHOR"
