name: Workflow security

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/**

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The token lets zizmor run its online audits (impostor commits, ref confusion, known vulnerable actions).
      - name: Audit workflows, actions and Dependabot config
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          docker run --rm -e GH_TOKEN -v "$PWD:/repo:ro" -w /repo
          ghcr.io/zizmorcore/zizmor:1.30.1@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101
          --format github .
