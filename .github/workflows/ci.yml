name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & boundaries
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Lint
        run: pnpm lint
      - name: Dependency boundaries
        run: pnpm depcruise

  typecheck:
    name: Typecheck
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Typecheck
        run: pnpm typecheck

  build:
    name: Build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build
        run: pnpm build

  unit:
    name: Unit tests
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Unit tests
        run: pnpm test

  integration:
    name: Integration tests
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Integration tests
        run: pnpm test:int

  migrations:
    name: Migrations
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check migration history
        run: pnpm --filter @owlwire/db db:check
      - name: Check schema matches migrations
        run: |
          pnpm --filter @owlwire/db db:generate
          # A schema change without a committed migration makes drizzle-kit write new files here.
          drift=$(git status --porcelain --untracked-files=all -- packages/db/drizzle)
          if [ -n "$drift" ]; then
            echo "::error::packages/db/src/schema changed without a migration. Run 'pnpm --filter @owlwire/db db:generate' and commit the result."
            printf '%s\n' "$drift"
            git diff -- packages/db/drizzle
            exit 1
          fi

  # Informational: merged unit + integration coverage in the job summary. No threshold; not a required check.
  coverage:
    name: Coverage
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Unit and integration tests with coverage
        run: pnpm exec vitest run --coverage --passWithNoTests
      - name: Write coverage summary
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
