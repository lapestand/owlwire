name: Spelling

on:
  # Pull requests and pushes to main run this through ci.yml; the gate job there (CI passed) is the required
  # check.
  workflow_call:

permissions:
  contents: read

jobs:
  typos:
    name: typos
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads _typos.toml for the project allowlist.
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
