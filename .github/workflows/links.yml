name: Links

on:
  pull_request:
    paths:
      - '**/*.md'
      - lychee.toml
      - .github/workflows/links.yml
  schedule:
    - cron: '53 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    name: lychee
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The token raises GitHub's rate limit for github.com links; exclusions live in lychee.toml.
      - name: Check links in Markdown
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(git ls-files '*.md')
          docker run --rm -e GITHUB_TOKEN -v "$PWD:/repo:ro" -w /repo \
            lycheeverse/lychee:0.24.2@sha256:e2d19e57cf6ab037026f20b8e449a1f30d9d7f81eef4194763aab2eab20bd28d \
            --config lychee.toml --no-progress "${files[@]}"
