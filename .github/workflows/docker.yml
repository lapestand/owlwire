name: Docker

on:
  # Pull requests and pushes to main run this through ci.yml; the gate job there (CI passed) is the required
  # check.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: Docker image smoke test
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: deploy/compose
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate a throwaway .env
        run: |
          owner_password=$(openssl rand -hex 16)
          app_password=$(openssl rand -hex 24)
          auth_password=$(openssl rand -hex 24)
          kek=$(openssl rand -base64 32)
          auth_secret=$(openssl rand -base64 32)
          for secret in "$owner_password" "$app_password" "$auth_password" "$kek" "$auth_secret"; do
            echo "::add-mask::$secret"
          done
          umask 077
          sed \
            -e "s|^OWLWIRE_DB_OWNER_PASSWORD=.*|OWLWIRE_DB_OWNER_PASSWORD=$owner_password|" \
            -e "s|^OWLWIRE_DB_APP_PASSWORD=.*|OWLWIRE_DB_APP_PASSWORD=$app_password|" \
            -e "s|^OWLWIRE_DB_AUTH_PASSWORD=.*|OWLWIRE_DB_AUTH_PASSWORD=$auth_password|" \
            -e "s|^OWLWIRE_KEK=.*|OWLWIRE_KEK=$kek|" \
            -e "s|^OWLWIRE_AUTH_SECRET=.*|OWLWIRE_AUTH_SECRET=$auth_secret|" \
            .env.example > .env
      # The compose file both names the image and builds it from docker/Dockerfile.
      - name: Build image
        run: docker compose build owlwire
      - name: Start the stack
        run: docker compose up -d --no-build --wait --wait-timeout 180
      - name: Check readiness
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/readyz; then
              echo
              exit 0
            fi
            sleep 2
          done
          echo "::error::/readyz did not return success"
          exit 1
      # The compose file runs the server as non-root, with a read-only root filesystem, no Linux capabilities and
      # no-new-privileges. Readiness above already proves the server works that way; this checks the settings
      # took effect, both as Docker reports them and as the kernel sees the running process.
      - name: Check container hardening
        run: |
          cid=$(docker compose ps -q owlwire)
          failed=0
          check() {
            if [ "$2" = "$3" ]; then
              echo "ok: $1 = $2"
            else
              echo "::error::$1 is '$2', expected '$3'"
              failed=1
            fi
          }
          check 'image user' "$(docker inspect -f '{{.Config.User}}' "$cid")" 1000:1000
          check 'uid in the container' "$(docker compose exec -T owlwire id -u)" 1000
          check 'read-only root filesystem' "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$cid")" true
          check 'tmpfs mounts' "$(docker inspect -f '{{json .HostConfig.Tmpfs}}' "$cid")" null
          check 'dropped capabilities' "$(docker inspect -f '{{json .HostConfig.CapDrop}}' "$cid")" '["ALL"]'
          check 'added capabilities' "$(docker inspect -f '{{json .HostConfig.CapAdd}}' "$cid")" null
          check 'privileged' "$(docker inspect -f '{{.HostConfig.Privileged}}' "$cid")" false
          check 'security options' "$(docker inspect -f '{{json .HostConfig.SecurityOpt}}' "$cid")" '["no-new-privileges:true"]'
          status=$(docker compose exec -T owlwire cat /proc/1/status)
          check 'effective capabilities of the server' "$(awk '/^CapEff:/ {print $2}' <<< "$status")" 0000000000000000
          check 'no_new_privs of the server' "$(awk '/^NoNewPrivs:/ {print $2}' <<< "$status")" 1
          if docker compose exec -T owlwire touch /app/probe 2>/dev/null; then
            echo "::error::the root filesystem is writable"
            failed=1
          else
            echo "ok: writing to /app fails"
          fi
          exit "$failed"
      # serve migrates on startup; running migrate again must be a no-op.
      - name: Re-run migrations
        run: docker compose exec -T owlwire owlwire migrate
      - name: Print logs with secrets masked
        if: failure()
        run: |
          docker compose ps -a
          logs=$(docker compose logs --no-color --timestamps)
          while IFS= read -r line; do
            key=${line%%=*}
            value=${line#*=}
            case "$key" in
              OWLWIRE_DB_OWNER_PASSWORD | OWLWIRE_DB_APP_PASSWORD | OWLWIRE_DB_AUTH_PASSWORD | OWLWIRE_KEK | OWLWIRE_KEK_PREVIOUS | OWLWIRE_AUTH_SECRET | OWLWIRE_TELEGRAM_BOT_TOKEN)
                if [ -n "$value" ]; then
                  logs=${logs//"$value"/***}
                fi
                ;;
            esac
          done < .env
          printf '%s\n' "$logs"
      - name: Tear down
        if: always()
        run: |
          docker compose down -v --remove-orphans
          rm -f .env
