name: Release

# Publishes a release from a version tag: a multi-arch image on GHCR with semver tags, a keyless cosign
# signature, SLSA build provenance, an SPDX SBOM and a GitHub release with notes from the conventional commits
# since the previous tag. How to cut a release is in CONTRIBUTING.md (maintainers).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/lapestand/owlwire
  GIT_CLIFF_VERSION: 2.14.2
  GIT_CLIFF_SHA256: 24f397c733add5390fdceee3a2088588ab0d5f944ce00d34cb7029b888cf2db4

jobs:
  release:
    name: Release
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: write # create the GitHub release and upload the SBOM
      packages: write # push the image to GHCR
      id-token: write # keyless cosign signature and attestation, both through GitHub OIDC
      attestations: write # store the build provenance attestation
    steps:
      # Full history: the release notes cover the commits since the previous tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a semver tag (vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-PRERELEASE)"
            exit 1
          fi
          # Any pre-release suffix (-rc.1, -beta.2, ...) marks a pre-release: no `latest`, no major/minor tags.
          if [[ $TAG == *-* ]]; then prerelease=true; else prerelease=false; fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # Labels on each platform image and annotations on the multi-arch index.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          # semver skips {{major}}.{{minor}} and {{major}} for pre-releases; latest is set explicitly below.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ steps.version.outputs.prerelease == 'false' }}
          # source links the GHCR package to this repository; revision is the tagged commit.
          labels: |
            org.opencontainers.image.title=Owlwire
            org.opencontainers.image.licenses=BUSL-1.1
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          annotations: |
            org.opencontainers.image.title=Owlwire
            org.opencontainers.image.licenses=BUSL-1.1
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      # BuildKit's own provenance and SBOM attestations are off: provenance comes from attest-build-provenance and
      # the SBOM from syft below, so each exists once. No build cache, so a release never builds from cache
      # entries that other workflows wrote.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      # Keyless: the certificate binds the signature to this workflow run through GitHub OIDC.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/owlwire-${{ steps.version.outputs.version }}.spdx.json
          syft-version: v1.54.1
          upload-artifact: false
          upload-release-assets: false
      - name: Install git-cliff
        run: |
          archive="git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/${archive}"
          echo "${GIT_CLIFF_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/git-cliff-${GIT_CLIFF_VERSION}/git-cliff" "$RUNNER_TEMP/git-cliff"
      # A stable release lists everything since the previous stable release; a pre-release lists what changed
      # since the previous tag of any kind. Grouping is in cliff.toml.
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mapfile -t earlier < <(git tag --list 'v*' --merged "${TAG}^" --sort=-v:refname)
          prev=
          for t in "${earlier[@]}"; do
            if [ "$PRERELEASE" = true ] || [[ $t != *-* ]]; then
              prev=$t
              break
            fi
          done
          # Without a previous tag the notes cover the whole history up to the tagged commit (the checkout).
          range=()
          if [ -n "$prev" ]; then range=("${prev}..${TAG}"); fi
          echo "Release notes for ${range[*]:-the whole history}"
          {
            echo "## Image"
            echo
            echo "\`${IMAGE}:${VERSION}\` (\`${DIGEST}\`), linux/amd64 and linux/arm64."
            echo
            echo '```sh'
            echo "cosign verify ${IMAGE}@${DIGEST} \\"
            echo "  --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/\\.github/workflows/release\\.yml@refs/tags/v' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "gh attestation verify oci://${IMAGE}@${DIGEST} --repo ${GITHUB_REPOSITORY}"
            echo '```'
            echo
            echo "The SPDX SBOM is attached below."
            echo
            echo "## Changes${prev:+ since $prev}"
            "$RUNNER_TEMP/git-cliff" --config cliff.toml "${range[@]}"
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          flags=(--verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md")
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease --latest=false); fi
          gh release create "$TAG" "${flags[@]}" -R "$GITHUB_REPOSITORY" \
            "$RUNNER_TEMP/owlwire-${VERSION}.spdx.json"
