name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems do not belong here. Please follow [SECURITY.md](https://github.com/lapestand/owlwire/blob/main/SECURITY.md) instead.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The Owlwire version (from package.json) or the commit you are running.
      placeholder: 0.35.32 or 1385469
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Docker Compose (deploy/compose)
        - Development container (./dev)
        - Other
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: Channel
      description: The channel involved, if any.
      options:
        - None
        - Telegram
        - WhatsApp
        - Discord
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Send an event with ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output. Remove tokens, passwords, keys, webhook URLs and other secrets before posting.
      render: text
